<article class="product-card">
  <a class="product-card__media" [routerLink]="['/shop/products', product.id]">
    <img [src]="product.thumbnail" [alt]="product.title" loading="lazy" />
    <span class="product-card__stock" [class.product-card__stock--out]="product.stock === 0">
      {{ product.stock === 0 ? 'Out of stock' : product.stock + ' in stock' }}
    </span>
  </a>

  <div class="product-card__body">
    <span class="product-card__category">{{ product.category }}</span>
    <a class="product-card__title" [routerLink]="['/shop/products', product.id]">{{ product.title }}</a>
    <div class="product-card__footer">
      <span class="product-card__price">${{ product.price.toFixed(2) }}</span>
      <button
        class="product-card__add"
        type="button"
        [disabled]="product.stock === 0"
        (click)="addToCart.emit(product)"
      >
        {{ product.stock === 0 ? 'Notify me' : 'Add' }}
      </button>
    </div>
  </div>
</article>
