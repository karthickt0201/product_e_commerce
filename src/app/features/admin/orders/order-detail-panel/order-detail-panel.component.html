<div class="scrim" [@scrim] (click)="closed.emit()">
  <aside class="panel" [@slidePanel] (click)="$event.stopPropagation()">
    <header class="panel__header">
      <div>
        <h2>{{ order.id }}</h2>
        <p>{{ order.customerName }} · {{ order.date | date:'mediumDate' }}</p>
      </div>
      <button class="panel__close" type="button" (click)="closed.emit()">✕</button>
    </header>

    <div class="panel__status">
      <label for="status">Order status</label>
      <select id="status" [value]="order.status" (change)="onStatusSelect($any($event.target).value)">
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="panel__items">
      <h3>Line items</h3>
      <div class="line-item" *ngFor="let item of order.items">
        <span class="line-item__title">{{ item.title }}</span>
        <span class="line-item__qty">x{{ item.quantity }}</span>
        <span class="line-item__price">${{ (item.price * item.quantity).toFixed(2) }}</span>
      </div>
    </div>

    <div class="panel__summary">
      <div class="summary-row"><span>Subtotal</span><span>${{ order.subtotal.toFixed(2) }}</span></div>
      <div class="summary-row"><span>Tax</span><span>${{ order.tax.toFixed(2) }}</span></div>
      <div class="summary-row summary-row--total"><span>Total</span><span>${{ order.total.toFixed(2) }}</span></div>
    </div>
  </aside>
</div>
