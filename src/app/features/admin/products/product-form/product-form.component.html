<div class="modal-backdrop" [@backdropAnim] (click)="closed.emit()">
  <div class="modal-sheet" [@sheetAnim] (click)="$event.stopPropagation()">
    <header class="modal-sheet__header">
      <h2>{{ product ? 'Edit product' : 'Add product' }}</h2>
      <button type="button" class="modal-sheet__close" (click)="closed.emit()">✕</button>
    </header>

    <form class="modal-sheet__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label>Title</label>
        <input formControlName="title" placeholder="Product title" />
        <p class="field__error" *ngIf="form.controls.title.invalid && form.controls.title.touched">Title is required.</p>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <input formControlName="category" placeholder="e.g. skincare" />
        </div>
        <div class="field">
          <label>Price ($)</label>
          <input type="number" step="0.01" formControlName="price" />
        </div>
        <div class="field">
          <label>Stock</label>
          <input type="number" formControlName="stock" />
        </div>
      </div>

      <div class="field">
        <label>Thumbnail URL</label>
        <input formControlName="thumbnail" placeholder="https://..." />
      </div>

      <div class="field">
        <label>Description</label>
        <textarea formControlName="description" rows="3" placeholder="Short product description"></textarea>
      </div>

      <div class="modal-sheet__actions">
        <button type="button" class="btn btn--ghost" (click)="closed.emit()">Cancel</button>
        <button type="submit" class="btn btn--primary">{{ product ? 'Save changes' : 'Add product' }}</button>
      </div>
    </form>
  </div>
</div>
